<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Tubulações Cozinha Vivo Rio</title>
<meta name="description" content="Modelo 3D interativo dos pontos e trechos hidrossanitários e de gás da cozinha de banquetes (subsolo) — Vivo Rio.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --bg2:#e7eaee; --panel:rgba(255,255,255,.80); --line:#c8ced7; --text:#1a1e24; --text2:#5a6370;
  --accent:#6a4cff; --pend:#e3157e; --arch:#8a93a1; --grid:#cdd3db; --ok:#1f8a5b; --warn:#b7791f;
  --c-af:#1f6fd1; --c-aq:#d43a2f; --c-esg:#8b5a2b; --c-vent:#6f7782; --c-dre:#0fa3b8; --c-gas:#d9a100; --c-pluv:#2f8f5b;
  --c-exa:#f07a12; --c-exg:#b0602c; --c-ins:#c247d6; --c-aex:#7a8ea3;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1115; --bg2:#161a20; --panel:rgba(20,24,30,.80); --line:#2b323c; --text:#e5e8ed; --text2:#97a1ae;
    --accent:#9a86ff; --pend:#ff3d9d; --arch:#6a737f; --grid:#232931; --ok:#3fbf86; --warn:#e0a849; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1115; --bg2:#161a20; --panel:rgba(20,24,30,.80); --line:#2b323c; --text:#e5e8ed; --text2:#97a1ae;
  --accent:#9a86ff; --pend:#ff3d9d; --arch:#6a737f; --grid:#232931; --ok:#3fbf86; --warn:#e0a849; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:400 13px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
#stage{position:relative;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* barra superior */
#top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg2);min-height:48px;flex-wrap:wrap}
#top h1{font:600 14px/1.2 var(--sans);margin:0 10px 0 0;white-space:nowrap}
#top h1 small{display:block;font:400 11px var(--sans);color:var(--text2)}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button,.btn{background:transparent;border:0;padding:6px 10px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.btn{border:1px solid var(--line)}
.seg button[aria-pressed="true"],.btn[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.btn:hover,.seg button:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
#search{position:relative}
#search input{width:210px;padding:6px 8px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:12px}
#sugg{position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--bg);border:1px solid var(--line);border-top:0;max-height:260px;overflow:auto;display:none}
#sugg div{padding:5px 8px;cursor:pointer;font:12px var(--mono);display:flex;justify-content:space-between;gap:8px}
#sugg div span{color:var(--text2);font-family:var(--sans)}
#sugg div.on,#sugg div:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
/* painéis */
.panel{position:absolute;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);z-index:10}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:1px solid var(--accent);border-left:1px solid var(--accent)}
.panel::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent)}
#left{top:10px;left:10px;width:268px;max-height:calc(100% - 20px);overflow:auto;padding:10px 12px}
#right{top:10px;right:10px;width:384px;max-height:calc(100% - 20px);display:flex;flex-direction:column}
#right.min{width:auto}
#right.min .rbody,#right.min .tabs{display:none}
#right .rhead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
#right.min .rhead{border-bottom:0}
.tabs{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-right:1px solid var(--line);padding:8px 9px;cursor:pointer;color:var(--text2);white-space:nowrap;flex:none}
.tabs button[aria-selected="true"]{color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.rbody{overflow:auto;padding:12px;min-height:120px}
#minbtn{background:none;border:0;border-left:1px solid var(--line);padding:8px 10px;cursor:pointer;color:var(--text2);flex:none;white-space:nowrap}
h2{font:600 11px/1 var(--sans);letter-spacing:.02em;color:var(--text2);margin:14px 0 6px;text-transform:none}
h2:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:8px;padding:3px 0}
.row label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;min-width:0}
.row input[type=checkbox]{accent-color:var(--accent);margin:0}
.sw{width:18px;height:4px;flex:none;display:inline-block}
.cnt{font:11px var(--mono);color:var(--text2);white-space:nowrap}
.cnt b{font-weight:500;color:var(--text)}
.hint{color:var(--text2);font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
/* legenda */
#legend{left:10px;bottom:10px;padding:8px 10px;font-size:11px;max-width:560px;display:flex;flex-wrap:wrap;gap:4px 14px}
#legend .lg{display:flex;align-items:center;gap:6px;white-space:nowrap}
#legend svg{flex:none}
#legend .lt{color:var(--text2);margin-right:2px}
/* rodapé */
#foot{display:grid;grid-template-columns:2.4fr .9fr 1.1fr 1.4fr 1.9fr;border-top:1px solid var(--line);background:var(--bg2);padding-bottom:env(safe-area-inset-bottom,0px)}
#foot div{padding:5px 10px;border-right:1px solid var(--line);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#foot div:last-child{border-right:0}
#foot span{display:block;font-size:10px;color:var(--text2)}
#foot b{font:500 12px var(--mono)}
/* registro (campo) */
.card{border-top:2px solid var(--sys,var(--line));margin:-12px -12px 0;padding:12px}
.sit{display:inline-block;padding:4px 8px;font-weight:600;font-size:12px;border:1px solid currentColor;margin-bottom:10px}
.sit.ok{color:var(--ok)} .sit.inf{color:var(--warn)} .sit.pend{color:var(--pend)}
.card h3{font:600 18px/1.2 var(--sans);margin:0 0 4px}
.card .sub{color:var(--text2);margin-bottom:12px}
.meas{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.meas div{padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.meas div:nth-child(2n){border-right:0}
.meas span{display:block;font-size:11px;color:var(--text2)}
.meas b{font:500 26px/1.15 var(--mono)}
.meas b small{font-size:13px;color:var(--text2);margin-left:2px}
.meas .wide{grid-column:1/-1;border-right:0}
.meas .wide b{font:500 15px/1.3 var(--sans)}
.why{margin:10px 0 0;padding:8px 10px;border-left:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.why.p{border-color:var(--pend);background:color-mix(in srgb,var(--pend) 9%,transparent)}
.ref{margin-top:10px}
.ref b{font-family:var(--mono);font-weight:500}
.dl{margin-top:8px}
.dl a{display:block;color:var(--pend);cursor:pointer;padding:2px 0;text-decoration:none}
.dl a:hover{text-decoration:underline}
details{margin-top:12px;border:1px solid var(--line)}
summary{padding:7px 10px;cursor:pointer;color:var(--text2)}
details .tech{padding:0 10px 10px;font:12px/1.5 var(--mono);word-break:break-word}
details .tech p{margin:6px 0;font-family:var(--sans);color:var(--text2)}
/* listas */
.dv{border-left:2px solid var(--pend);padding:6px 8px;margin:6px 0;cursor:pointer;background:color-mix(in srgb,var(--pend) 5%,transparent)}
.dv:hover{background:color-mix(in srgb,var(--pend) 12%,transparent)}
.dv .h{display:flex;justify-content:space-between;gap:6px;font:500 12px var(--mono)}
.dv .g{font:500 11px var(--sans)}
.dv p{margin:3px 0 0;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}
th{color:var(--text2);font-weight:500}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.cota{border:1px solid var(--line);padding:6px 8px;margin:6px 0;cursor:pointer}
.cota .h{display:flex;justify-content:space-between;font:500 12px var(--mono)}
.cota .h button{background:none;border:1px solid var(--line);cursor:pointer;padding:0 6px;color:var(--text2)}
.cota table td{border:0;padding:1px 4px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
/* rótulos HTML */
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:11px var(--sans);color:var(--text2);opacity:.85}
.lbl.room{font-size:11px;letter-spacing:.01em}
.lbl.dim{font:500 12px var(--mono);color:var(--accent);background:var(--bg);padding:0 4px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);opacity:1}
.lbl.dim.loc{color:var(--text);border-color:var(--accent)}
.lbl.div{color:var(--pend);font:500 9px var(--mono);opacity:.9;transform:translate(-50%,-170%)}
#tip{position:absolute;z-index:40;pointer-events:none;background:var(--bg);border:1px solid var(--line);padding:4px 8px;font-size:12px;display:none;white-space:nowrap}
#tip b{font:500 12px var(--mono);margin-right:6px}
#mhint{position:absolute;z-index:40;pointer-events:none;font:500 11px var(--mono);color:var(--accent);background:var(--bg);border:1px solid var(--accent);padding:2px 6px;display:none;white-space:nowrap}
#mbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:15;padding:6px 12px;display:none;font-size:12px}
#toggleLeft{display:none}
@media (max-width:760px){
  #top h1 small{display:none}
  #search input{width:150px}
  #toggleLeft{display:inline-block}
  #left{display:none;top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:48%}
  #left.open{display:block}
  #right{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:55%}
  #right.min{left:auto}
  #legend{display:none}
  #foot{grid-template-columns:1fr 1fr}
  #foot div:nth-child(n+3){display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- tubulação ---------- */
function mergeGeoms(list){
  let np=0, ni=0; list.forEach(g=>{np+=g.attributes.position.count; ni+=g.index.count;});
  const pos=new Float32Array(np*3), nor=new Float32Array(np*3), idx=new Uint32Array(ni); let po=0, io=0;
  list.forEach(g=>{ pos.set(g.attributes.position.array, po*3); nor.set(g.attributes.normal.array, po*3);
    const ix=g.index.array; for(let i=0;i<ix.length;i++) idx[io+i]=ix[i]+po; po+=g.attributes.position.count; io+=ix.length; g.dispose(); });
  const out=new THREE.BufferGeometry(); out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor,3)); out.setIndex(new THREE.BufferAttribute(idx,1)); return out;
}
const UP = new THREE.Vector3(0,1,0);
function cyl(a, b, r){
  const A=new THREE.Vector3(...a), Bv=new THREE.Vector3(...b), d=Bv.clone().sub(A), L=d.length();
  const g=new THREE.CylinderGeometry(r, r, L, 8, 1, false);
  const q=new THREE.Quaternion().setFromUnitVectors(UP, d.normalize());
  const mtx=new THREE.Matrix4().compose(A.clone().add(Bv).multiplyScalar(.5), q, new THREE.Vector3(1,1,1));
  g.applyMatrix4(mtx); return g;
}
function pattern(a, b, r, style){
  // style: solid | dash (enterrado) | dot (inferido) | dashdot (inferido + enterrado)
  const A=new THREE.Vector3(...a), Bv=new THREE.Vector3(...b), d=Bv.clone().sub(A), L=d.length(); d.normalize();
  if(style==='solid' || L<0.02) return [cyl(a,b,r)];
  const seq = style==='dash' ? [[.16,.08]] : style==='dot' ? [[.045,.06]] : [[.16,.07],[.045,.07]];
  const out=[]; let s=0, k=0;
  while(s<L){ const [on,off]=seq[k%seq.length]; const e=Math.min(L, s+on);
    out.push(cyl(A.clone().addScaledVector(d,s).toArray(), A.clone().addScaledVector(d,e).toArray(), r)); s=e+off; k++; }
  return out;
}

function ductMesh(d){
  const a=new THREE.Vector3(...d.a), b=new THREE.Vector3(...d.b), v=b.clone().sub(a), L=v.length(); if(L<0.01) return null;
  const vert = Math.hypot(v.x,v.y) < 0.02;
  const g = vert ? new THREE.BoxGeometry(d.W, d.H, L) : new THREE.BoxGeometry(L, d.W, d.H);
  const col = d.status==='PENDENTE' ? new THREE.Color(css('--pend')) : colorOf(d.sistema);
  const inf = d.status!=='EXTRAÍDO';
  const mat = new THREE.MeshLambertMaterial({color:col, transparent:true, opacity: d.status==='EXTRAÍDO' ? .78 : .2, depthWrite: d.status==='EXTRAÍDO'});
  const m = new THREE.Mesh(g, mat);
  m.position.copy(a).add(b).multiplyScalar(.5);
  if(!vert) m.rotation.z = Math.atan2(v.y, v.x);
  const eg = new THREE.EdgesGeometry(g);
  const em = inf ? new THREE.LineDashedMaterial({color:col, dashSize:.12, gapSize:.08, transparent:true, opacity:.95})
                 : new THREE.LineBasicMaterial({color:col.clone().multiplyScalar(.6), transparent:true, opacity:.9});
  const e = new THREE.LineSegments(eg, em); if(inf) e.computeLineDistances(); m.add(e);
  m.userData = {kind:'duto', d, edge:e};
  G.ducts.add(m); ductMeshes.push(m); ductIndex.push({d, a, b, m});
  return m;
}

/* ---------- câmera / controles ---------- */
function makeControls(cam){
  if(controls) controls.dispose();
  controls = new THREE.OrbitControls(cam, canvas);
  controls.enableDamping = !RM; controls.dampingFactor = .12; controls.screenSpacePanning = true;
  controls.zoomSpeed = 1.1; controls.rotateSpeed = .8;
}
function viewOffset(){
  const r = canvas.parentElement.getBoundingClientRect(); let ox=0, oy=0;
  if(r.width>760){
    const L=$('#left'), Rp=$('#right');
    const lw = L.offsetParent ? L.offsetWidth+10 : 0, rw = Rp.classList.contains('min') ? 0 : Rp.offsetWidth+10;
    ox = -(lw-rw)/2;
  } else {
    const Rp=$('#right'), L=$('#left');
    const h = Math.max(Rp.classList.contains('min')?0:Rp.offsetHeight, L.classList.contains('open')?L.offsetHeight:0);
    oy = h ? Math.min(h, r.height*0.6)/2 : 0;
  }
  [persp, ortho].forEach(c=>{ c.setViewOffset(r.width, r.height, ox, oy, r.width, r.height); });
}
function resize(){
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  persp.aspect = r.width/r.height; persp.updateProjectionMatrix();
  const h = ortho.top - ortho.bottom, w = h*r.width/r.height, cx=(ortho.left+ortho.right)/2;
  ortho.left=cx-w/2; ortho.right=cx+w/2; ortho.updateProjectionMatrix();
  viewOffset();
}
window.addEventListener('resize', resize);
let anim=null;
function flyTo(target, pos, dur){
  if(RM || !dur){ controls.target.copy(target); camera.position.copy(pos); controls.update(); return; }
  const t0=performance.now(), T0=controls.target.clone(), P0=camera.position.clone();
  anim = now=>{ let k=Math.min(1,(now-t0)/dur); k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    controls.target.lerpVectors(T0,target,k); camera.position.lerpVectors(P0,pos,k); if(k>=1) anim=null; };
}
function visibleBox(){
  const b=new THREE.Box3();
  ptMeshes.forEach(m=>{ if(m.visible) b.expandByPoint(m.position); });
  pipeMeshes.forEach(m=>{ if(m.visible){ m.geometry.computeBoundingBox(); b.union(m.geometry.boundingBox); }});
  ductIndex.forEach(si=>{ if(si.m.visible){ [si.a, si.b].forEach(p=>{ if(p.z<=2.0) b.expandByPoint(p); }); } });
  if(b.isEmpty()) b.copy(B);
  b.max.z = Math.min(b.max.z, 2.0);
  return b;
}
function fit(dur){
  const b=visibleBox(), c=b.getCenter(new THREE.Vector3()), s=b.getSize(new THREE.Vector3());
  const rad = Math.max(s.x, s.y, 4)*0.40;
  if(state.view==='plan'){
    const r=canvas.getBoundingClientRect(), asp=r.width/r.height; const h=Math.max(s.y*1.15, s.x*1.15/asp, 4);
    ortho.top=h/2; ortho.bottom=-h/2; ortho.left=-h*asp/2; ortho.right=h*asp/2; ortho.zoom=1; ortho.updateProjectionMatrix();
    controls.target.set(c.x,c.y,c.z); camera.position.set(c.x,c.y,c.z+60); controls.update(); return;
  }
  const dist = rad/Math.tan(persp.fov*Math.PI/360)*1.05;
  const dir = state.view==='under' ? new THREE.Vector3(-0.30,-0.80,-0.45) : new THREE.Vector3(-0.42,-0.78,0.62);
  dir.normalize();
  flyTo(c, c.clone().addScaledVector(dir, dist), dur);
}
function setView(v){
  state.view=v;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.view===v));
  if(v==='plan'){ camera=ortho; makeControls(ortho); controls.enableRotate=false; }
  else { camera=persp; makeControls(persp); controls.enableRotate=true; }
  controls.mouseButtons = {LEFT:v==='plan'?THREE.MOUSE.PAN:THREE.MOUSE.ROTATE, MIDDLE:THREE.MOUSE.DOLLY, RIGHT:THREE.MOUSE.PAN};
  controls.touches = {ONE:v==='plan'?THREE.TOUCH.PAN:THREE.TOUCH.ROTATE, TWO:THREE.TOUCH.DOLLY_PAN};
  MAT.floor.opacity = v==='under' ? .025 : .05;
  applyVisibility(); resize(); fit(0);
}

function discOn(d){ if(d==='ARQ') return state.lay.arq; return Object.keys(state.sis).some(k=>state.sis[k] && SIS[k].disc===d); }
function divVisible(d){

  pipeMeshes.forEach(m=>{ const t=m.userData.t; m.visible = !!state.sis[t.sistema] && state.st[t.status] && state.pav['Subsolo']; });

function pickAt(x, y, opts={}){
  let best=null, bd=opts.ptTol||14;
  ptMeshes.forEach(m=>{ if(!m.visible||clippedOut(m.position)) return; const s=toScreen(m.position); if(s.z>1) return;
    const d=Math.hypot(s.x-x,s.y-y); if(d<bd){bd=d; best={kind:'ponto', obj:m.userData.p, pos:m.position.clone(), d};} });
  if(best) return best;
  if(opts.nodes){ let bn=null, bnd=10;
    M.trechos.forEach(t=>{ if(!state.sis[t.sistema]) return; [t.a,t.b].forEach(id=>{ const n=nodes[id]; const P=new THREE.Vector3(n.x,n.y,n.z); if(clippedOut(P)) return;
      const s=toScreen(P); if(s.z>1) return; const d=Math.hypot(s.x-x,s.y-y); if(d<bnd){bnd=d; bn={kind:'vertice', obj:t, pos:P, node:n};} }); });
    if(bn) return bn; }
  let bs=null, bsd=opts.segTol||9;
  segIndex.forEach(si=>{ if(!state.sis[si.t.sistema] || !state.st[si.t.status]) return;
    const A=toScreen(si.a), Bs=toScreen(si.b); if(A.z>1&&Bs.z>1) return;
    const vx=Bs.x-A.x, vy=Bs.y-A.y, L2=vx*vx+vy*vy; let k=L2?((x-A.x)*vx+(y-A.y)*vy)/L2:0; k=Math.max(0,Math.min(1,k));
    const d=Math.hypot(A.x+vx*k-x, A.y+vy*k-y);
    if(d<bsd){ const P=si.a.clone().lerp(si.b,k); if(clippedOut(P)) return; bsd=d; bs={kind:'trecho', obj:si.t, pos:P, d}; } });
  if(bs) return bs;
  let bd2=null, bdd=opts.segTol||10;
  ductIndex.forEach(si=>{ if(!si.m.visible) return;
    const A=toScreen(si.a), Bs=toScreen(si.b); if(A.z>1&&Bs.z>1) return;
    const vx=Bs.x-A.x, vy=Bs.y-A.y, L2=vx*vx+vy*vy; let k=L2?((x-A.x)*vx+(y-A.y)*vy)/L2:0; k=Math.max(0,Math.min(1,k));
    const d=Math.hypot(A.x+vx*k-x, A.y+vy*k-y);
    if(d<bdd){ const P=si.a.clone().lerp(si.b,k); if(clippedOut(P)) return; bdd=d; bd2={kind:'duto', obj:si.d, pos:P, d}; } });
  if(bd2) return bd2;
  let bm=null, bmd=18;
  mecObjs.forEach(m=>{ if(!m.visible||clippedOut(m.position)) return; const s=toScreen(m.position); if(s.z>1) return;
    const d=Math.hypot(s.x-x,s.y-y); if(d<bmd){ bmd=d; bm={kind:'mec', obj:m.userData.o, mk:m.userData.kind, pos:m.position.clone(), d}; } });
  if(bm) return bm;
  if(opts.surface){
    const r=canvas.getBoundingClientRect(); const ray=new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(x/r.width*2-1, -(y/r.height)*2+1), camera);
    const hits=ray.intersectObjects(archPick.filter(o=>o.parent.visible), false).filter(h=>!clippedOut(h.point));
    if(hits.length) return {kind:'superficie', obj:hits[0].object.userData, pos:hits[0].point.clone()};
  }
  if(opts.div){ let bdv=null, dd=14; divMarkers.forEach(m=>{ if(!m.visible) return; const s=toScreen(m.position); const d=Math.hypot(s.x-x,s.y-y); if(d<dd){dd=d; bdv={kind:'div', obj:m.userData.d};} }); if(bdv) return bdv; }
  return null;
}

/* ---------- cotas (dimensionamento) ---------- */
function dimLine(p1, p2, group, cls, offsetDir){
  const g=new THREE.Group(); group.add(g);
  let a=p1.clone(), b=p2.clone();
  const dir=b.clone().sub(a); const L=dir.length(); if(L<1e-4) return {g, L:0};
  dir.normalize();
  const view = camera.position.clone().sub(a.clone().add(b).multiplyScalar(.5)).normalize();
  let perp = new THREE.Vector3().crossVectors(dir, view); if(perp.lengthSq()<1e-6) perp.set(0,0,1); perp.normalize();
  if(offsetDir){ const o=perp.clone().multiplyScalar(offsetDir);
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1, p1.clone().add(o.clone().multiplyScalar(1.12))]), MAT.accLine));
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p2, p2.clone().add(o.clone().multiplyScalar(1.12))]), MAT.accLine));
    a.add(o); b.add(o); }
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]), MAT.accLine));
  const tk = Math.min(0.12, Math.max(0.05, L*0.08));
  const t = dir.clone().add(perp).normalize().multiplyScalar(tk);
  [a,b].forEach(p=>g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p.clone().sub(t), p.clone().add(t)]), MAT.accLine)));
  g.children.forEach(c=>c.renderOrder=7);
  const lbl = addLabel(fmt(L)+' m', a.clone().add(b).multiplyScalar(.5), 'dim '+(cls||''), {kind:'dim', g});
  g.userData.lbl=lbl; return {g, L, lbl};
}
function clearGroup(grp){ grp.children.slice().forEach(c=>{ if(c.userData && c.userData.lbl) removeLabel(c.userData.lbl);
  c.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); grp.remove(c); }); }

/* ---------- seleção ---------- */
function setSel(sel){
  pipeMeshes.forEach(m=>{ if(m.userData.sel){ m.userData.sel=false; m.material.color.copy(colorOf(m.userData.t.sistema)); m.material.emissive&&m.material.emissive.set(0); }});
  ptMeshes.forEach(m=>{ if(m.userData.sel){ m.userData.sel=false; m.scale.set(1,1,1); refreshPointColor(m);} });
  ductMeshes.forEach(m=>{ if(m.userData.sel){ m.userData.sel=false; m.material.color.copy(m.userData.c0); m.material.opacity=m.userData.o0; } });
  mecObjs.forEach(m=>{ if(m.userData.sel){ m.userData.sel=false; m.material.opacity=m.userData.o0; } });
  clearGroup(G.loc);
  state.sel = sel;
  if(sel && sel.kind==='ponto'){ const m=ptById[sel.id]; m.userData.sel=true; m.scale.setScalar(1.5); refreshPointColor(m); drawLocacao(sel.obj); }
  if(sel && sel.kind==='trecho'){ const m=pipeMeshes.find(m=>m.userData.t.id===sel.id); m.userData.sel=true; m.material.color.set(css('--accent')); }
  if(sel && sel.kind==='duto'){ const m=ductMeshes.find(m=>m.userData.d.id===sel.id); if(m){ m.userData.sel=true; m.userData.c0=m.material.color.clone(); m.userData.o0=m.material.opacity;
    m.material.color.set(css('--accent')); m.material.opacity=.9; } }
  if(sel && sel.kind==='mec'){ const m=mecObjs.find(m=>m.userData.o.id===sel.id); if(m){ m.userData.sel=true; m.userData.o0=m.material.opacity; m.material.opacity=.6; } }
  state.tab='reg'; openPanel(true); renderTab();
}
function drawLocacao(p){
  const L = M.locacao[p.id]; const P=new THREE.Vector3(p.x,p.y,p.z);
  if(L){ ['A','B'].forEach(k=>{ const c=L[k]; if(!c) return; const F=new THREE.Vector3(c.face[0],c.face[1],p.z);
      const d=dimLine(P, F, G.loc, 'loc'); if(d.lbl) d.lbl.el.textContent = k+' '+fmt(c.dist)+' m'; }); }
  const amb = M.ambientes.find(a=>a.id===p.amb);
  const zf = amb ? amb.pa : p.z - p.h;
  if(Math.abs(p.z - zf) > 0.004){ const d=dimLine(P, new THREE.Vector3(p.x,p.y,zf), G.loc, 'loc', 0.18);
    if(d.lbl) d.lbl.el.textContent = (p.z>=zf?'h ':'prof. ')+fmt(Math.abs(p.z-zf))+' m'; }
}
function center(pos, dist){
  const d = dist || 5;
  if(state.view==='plan'){ flyTo(new THREE.Vector3(pos.x,pos.y,pos.z), new THREE.Vector3(pos.x,pos.y,pos.z+60), 500); return; }
  const dir = camera.position.clone().sub(controls.target).normalize();
  flyTo(pos.clone(), pos.clone().addScaledVector(dir, d), 600);
}

    <tr><td>Louças invadindo parede</td><td class="n">${V.loucas.filter(l=>l.invasao_m2>0).length} / ${V.loucas.length}</td></tr>
    <tr><td>Louças encostadas (folga ≤ 3 cm)</td><td class="n">${V.loucas.filter(l=>l.folga_m<=0.03).length} · ilhas ${V.loucas.filter(l=>l.ilha).length} · afastadas ${V.loucas.filter(l=>!l.ok).length}</td></tr>
    <tr><td>Pontos sem parede de referência</td><td class="n">${V.locacao_sem_referencia.length}</td></tr>
    ${V.dutos?`<tr><td>Pontas de duto ligadas ou declaradas</td><td class="n">${esc(V.dutos.resumo)}</td></tr>`:''}</table>`;
  const niv = `<table><tr><th>Nível</th><th>PA</th><th>PO</th><th>Status</th></tr>`+M.niveis.filter(n=>n.id.startsWith('M')||n.id.startsWith('N-D')||n.id.startsWith('N-T')).map(n=>
    `<tr><td>${esc(n.id)} · ${esc(n.ambiente)}</td><td class="n">${n.pa!=null?fmt(n.pa):fmt(n.z)}</td><td class="n">${n.po!=null?fmt(n.po):'—'}</td><td>${esc(n.status.toLowerCase())}</td></tr>`).join('')+`</table>`;
  const pr = M.premissas.map(p=>`<p style="margin:4px 0"><b class="mono">${p.id}</b> ${esc(p.texto)}</p>`).join('');
  const pl = `<table><tr><th>Prancha</th><th>Esc. / rev. / data</th></tr>`+M.pranchas.map(p=>`<tr><td><b class="mono" style="font-weight:500">${esc(p.codigo)}</b><br><span class="hint">${esc(p.uso)}</span></td><td>${esc(p.escala)}<br>${esc(p.rev)} · ${esc(p.data)}</td></tr>`).join('')+`</table>`;
  return `<h2>Pontos por sistema e status</h2>${t1}<h2>Verificações</h2>${ver}
    <div class="toolbar" style="margin-top:10px"><button class="btn" data-csv="pontos">pontos.csv</button><button class="btn" data-csv="trechos">trechos.csv</button>
    <button class="btn" data-csv="divergencias">divergencias.csv</button><button class="btn" data-csv="niveis">niveis.csv</button><button class="btn" data-csv="dutos">dutos.csv</button></div>
    <h2>Níveis</h2>${niv}<h2>Premissas</h2>${pr}<h2>Pranchas</h2>${pl}`;
}
function renderTab(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===state.tab));
  const R=$('#rbody');
  R.innerHTML = state.tab==='reg'?renderReg():state.tab==='div'?renderDiv():state.tab==='cot'?renderCot():renderRes();
  R.querySelectorAll('[data-div]').forEach(e=>e.addEventListener('click', ()=>gotoDiv(e.dataset.div)));
  R.querySelectorAll('[data-pt]').forEach(e=>e.addEventListener('click', ()=>gotoId(e.dataset.pt)));
  R.querySelectorAll('[data-csv]').forEach(e=>e.addEventListener('click', ()=>download(e.dataset.csv+'.csv', CSV[e.dataset.csv]())));
  if(state.tab==='cot'){
    $('#cMeas').onclick=()=>toggleMeasure(); $('#cVis').onclick=()=>{state.cotasVis=!state.cotasVis; G.cot.visible=state.cotasVis;
      labels.forEach(L=>{ if(L.owner.kind==='dim' && L.owner.cota) L.el.style.display=state.cotasVis?'':'none'; }); renderTab(); };
    $('#cDec').onclick=()=>{state.decomp=!state.decomp; redrawCotas(); renderTab(); };
    $('#cClr').onclick=()=>{state.cotas=[]; redrawCotas(); renderTab(); };
    $('#cCsv').onclick=()=>{ download('pontos.csv', CSV.pontos()); setTimeout(()=>download('cotas.csv', CSV.cotas()), 300); };
    R.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); state.cotas=state.cotas.filter(c=>c.id!==b.dataset.del); redrawCotas(); renderTab(); }));
    R.querySelectorAll('[data-cota]').forEach(e=>e.addEventListener('click', ()=>{ const c=state.cotas.find(c=>c.id===e.dataset.cota);
      center(c.p1.clone().add(c.p2).multiplyScalar(.5), Math.max(2.5, c.d3*2)); }));
  }
}
function gotoDiv(id){
  const d=M.divergencias.find(x=>x.id===id); if(!d) return;
  d.disciplinas.forEach(ds=>{ if(ds==='ARQ'){ state.lay.arq=true; return; } Object.keys(state.sis).forEach(k=>{ if(SIS[k].disc===ds) state.sis[k]=true; }); });
  state.lay.div=true; buildFilters(); applyVisibility();
  const target = d.pos ? new THREE.Vector3(...d.pos) : (d.ids.length && ptById[d.ids[0]] ? ptById[d.ids[0]].position.clone() : null);
  if(target) center(target, 6);
  state.tab='div'; renderTab();
  const el=$(`#rbody [data-div="${id}"]`); if(el){ el.scrollIntoView({block:'nearest'}); el.style.outline='1px solid var(--pend)'; }
}
function gotoId(id){
  if(ptById[id]){ const m=ptById[id]; const p=m.userData.p; state.sis[p.sistema]=true; state.st[p.status]=true; buildFilters(); applyVisibility();
    setSel({kind:'ponto', id, obj:p}); center(m.position, 3.5); return true; }
  if(trById[id]){ const t=trById[id]; state.sis[t.sistema]=true; buildFilters(); applyVisibility(); setSel({kind:'trecho', id, obj:t});
    const A=nodes[t.a], Bn=nodes[t.b]; center(new THREE.Vector3((A.x+Bn.x)/2,(A.y+Bn.y)/2,(A.z+Bn.z)/2), 4); return true; }
  const du = M.dutos.find(d=>d.id===id);
  if(du){ state.sis[du.sistema]=true; state.st[du.status]=true; buildFilters(); applyVisibility(); setSel({kind:'duto', id, obj:du});
    center(new THREE.Vector3((du.a[0]+du.b[0])/2,(du.a[1]+du.b[1])/2,(du.a[2]+du.b[2])/2), Math.max(4, du.comprimento*1.2)); return true; }
  const mo = mecObjs.find(m=>m.userData.o.id===id);
  if(mo){ state.lay.equip=true; buildFilters(); applyVisibility(); setSel({kind:'mec', id, obj:mo.userData.o, mk:mo.userData.kind}); center(mo.position.clone(), 6); return true; }
  if(M.divergencias.some(d=>d.id===id)){ gotoDiv(id); return true; }
  return false;
}

/* ---------- medição ---------- */
const mMarker = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), MAT.acc); mMarker.renderOrder=8; mMarker.visible=false; G.meas.add(mMarker);
let mLine=null;
function toggleMeasure(on){
  state.measure = on===undefined ? !state.measure : on; state.m1=null;
  $('#measure').setAttribute('aria-pressed', state.measure); $('#mbar').style.display = state.measure?'block':'none';
  mMarker.visible=false; $('#mhint').style.display='none'; if(mLine){ G.meas.remove(mLine); mLine=null; }
  canvas.style.cursor = state.measure ? 'crosshair' : '';
  if(state.tab==='cot') renderTab();
}
$('#measure').addEventListener('click', ()=>toggleMeasure());
function snapAt(x, y, shift){
  let s = pickAt(x, y, {nodes:true, surface:true, ptTol:12, segTol:8});
  if(!s) return null;
  const names = {ponto:'ponto', vertice:'vértice', trecho:'eixo do tubo', duto:'eixo do duto', mec:'centro do equipamento', superficie:'superfície'};
  let pos = s.pos.clone(), label = names[s.kind] + (s.kind==='ponto'?' '+s.obj.id:'');
  if(shift && state.m1){ const d=pos.clone().sub(state.m1.pos); const ax=['x','y','z'].reduce((a,k)=>Math.abs(d[k])>Math.abs(d[a])?k:a,'x');
    pos = state.m1.pos.clone(); pos[ax] += d[ax]; label += ' · trava '+ax.toUpperCase(); }
  return {pos, label, ref: s.kind==='ponto'?s.obj.id:null};
}
let cotaSeq=0;
function addCota(a, b){
  cotaSeq++; const id='C-'+String(cotaSeq).padStart(2,'0');
  const d=b.pos.clone().sub(a.pos);
  const c={id, p1:a.pos.clone(), p2:b.pos.clone(), ini:a.ref||`(${fmt(a.pos.x)}; ${fmt(a.pos.y)}; ${fmt(a.pos.z)})`, fim:b.ref||`(${fmt(b.pos.x)}; ${fmt(b.pos.y)}; ${fmt(b.pos.z)})`,
    d3:d.length(), dh:Math.hypot(d.x,d.y), dx:d.x, dy:d.y, dz:d.z};
  state.cotas.push(c); redrawCotas(); state.tab='cot'; openPanel(true); renderTab();
}
function redrawCotas(){
  clearGroup(G.cot);
  state.cotas.forEach(c=>{
    const holder=new THREE.Group(); G.cot.add(holder);
    if(state.decomp){
      const p1=c.p1, px=new THREE.Vector3(c.p2.x,p1.y,p1.z), py=new THREE.Vector3(c.p2.x,c.p2.y,p1.z);
      [[p1,px,'ΔX'],[px,py,'ΔY'],[py,c.p2,'ΔZ']].forEach(([a,b,n])=>{ const d=dimLine(a,b,holder,''); if(d.lbl){ d.lbl.el.textContent=`${c.id} ${n} ${fmt(d.L)}`; d.lbl.owner.cota=true; } });
    } else { const d=dimLine(c.p1,c.p2,holder,''); if(d.lbl){ d.lbl.el.textContent=`${c.id} · ${fmt(c.d3)} m`; d.lbl.owner.cota=true; } }
    holder.userData.lbl=null;
  });
  // rótulos das cotas acompanham a visibilidade
  labels.forEach(L=>{ if(L.owner.cota) L.el.style.display=state.cotasVis?'':'none'; });
}
function clearGroupDeep(grp){ grp.traverse(o=>{ if(o.userData && o.userData.lbl) removeLabel(o.userData.lbl); }); }
const _clear = clearGroup; clearGroup = function(grp){ clearGroupDeep(grp); _clear(grp); };

/* ---------- eventos de ponteiro ---------- */
let down=null;
canvas.addEventListener('pointerdown', e=>{ down={x:e.clientX, y:e.clientY, t:performance.now()}; });
canvas.addEventListener('pointerup', e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x, e.clientY-down.y); down=null; if(moved>6) return;
  const r=canvas.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  if(state.measure){
    const s=snapAt(x, y, e.shiftKey); if(!s) return;
    if(!state.m1){ state.m1=s; } else { addCota(state.m1, s); state.m1=null; if(mLine){ G.meas.remove(mLine); mLine=null; } }
    return;
  }
  const h=pickAt(x, y, {div:true});
  if(!h){ setSel(null); return; }
  if(h.kind==='div'){ gotoDiv(h.obj.id); return; }
  setSel({kind:h.kind, id:h.obj.id, obj:h.obj, mk:h.mk});
});
const tip=$('#tip'), mh=$('#mhint');
canvas.addEventListener('pointermove', e=>{
  if(e.pointerType==='touch') return;
  const r=canvas.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  if(state.measure){
    const s=snapAt(x, y, e.shiftKey);
    if(s){ mMarker.visible=true; mMarker.position.copy(s.pos);
      let t=s.label; if(state.m1){ t += ' · '+fmt(s.pos.distanceTo(state.m1.pos))+' m';
        if(mLine) G.meas.remove(mLine); mLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([state.m1.pos, s.pos]), MAT.accLine); mLine.renderOrder=8; G.meas.add(mLine); }
      mh.textContent=t; mh.style.display='block'; mh.style.left=(x+14)+'px'; mh.style.top=(y+14)+'px';
    } else { mMarker.visible=false; mh.style.display='none'; }
    tip.style.display='none'; return;
  }
  if(down) { tip.style.display='none'; return; }
  const h=pickAt(x, y, {div:true});
  if(h){ const o=h.obj; const nm = h.kind==='div' ? o.tipo : h.kind==='ponto' ? o.titulo : h.kind==='duto' ? 'Duto '+o.rotulo+' · '+(SIS[o.sistema]||{}).nome : h.kind==='mec' ? (o.nome||'Grelha / difusor') : 'Tubo · '+(SIS[o.sistema]||{}).nome;
    tip.innerHTML=`<b>${esc(o.id)}</b>${esc(nm)}`; tip.style.display='block'; tip.style.left=(x+14)+'px'; tip.style.top=(y+12)+'px'; canvas.style.cursor='pointer'; }
  else { tip.style.display='none'; canvas.style.cursor=''; }
});
canvas.addEventListener('pointerleave', ()=>{ tip.style.display='none'; mh.style.display='none'; });
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(state.measure){ if(state.m1){ state.m1=null; if(mLine){G.meas.remove(mLine); mLine=null;} } else toggleMeasure(false); } else { $('#sugg').style.display='none'; } }
});

/* ---------- busca ---------- */
const ALLIDS = [...M.pontos.map(p=>[p.id,p.titulo]), ...M.trechos.map(t=>[t.id,'Tubo · '+(SIS[t.sistema]||{}).nome]),
  ...M.dutos.map(d=>[d.id,'Duto · '+d.rotulo]), ...mecObjs.map(m=>[m.userData.o.id, m.userData.o.nome||m.userData.kind]), ...M.divergencias.map(d=>[d.id,d.tipo])];
let sIdx=-1;
function sugg(){
  const q=$('#q').value.trim().toUpperCase(), box=$('#sugg');
  if(!q){ box.style.display='none'; return; }
  const hits=ALLIDS.filter(([id,n])=>id.toUpperCase().includes(q) || n.toUpperCase().includes(q)).slice(0,30);
  sIdx=-1; box.innerHTML = hits.map(([id,n])=>`<div data-id="${id}">${id}<span>${esc(n)}</span></div>`).join('') || '<div>sem resultados</div>';
  box.style.display='block';
  box.querySelectorAll('[data-id]').forEach(d=>d.addEventListener('mousedown', ev=>{ ev.preventDefault(); gotoId(d.dataset.id); $('#q').value=d.dataset.id; box.style.display='none'; }));
}
$('#q').addEventListener('input', sugg);
$('#q').addEventListener('keydown', e=>{
  const items=[...$('#sugg').querySelectorAll('[data-id]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sIdx=(sIdx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; items.forEach((d,i)=>d.classList.toggle('on',i===sIdx)); }
  if(e.key==='Enter'){ const id = sIdx>=0&&items[sIdx] ? items[sIdx].dataset.id : $('#q').value.trim().toUpperCase(); if(gotoId(id)){ $('#q').value=id; $('#sugg').style.display='none'; } }
});
$('#q').addEventListener('blur', ()=>setTimeout(()=>$('#sugg').style.display='none', 150));

/* ---------- CSV ---------- */
const sc = v => { if(v==null) return ''; if(typeof v==='number') return String(v).replace('.', ','); const s=String(v); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
const toCSV = (head, rows) => '﻿'+[head.join(';'), ...rows.map(r=>r.map(sc).join(';'))].join('\r\n');
const CSV = {
  pontos: ()=>toCSV(['id','tipo','titulo','sistema','dn','x','y','z','h','pavimento','ambiente','equipamento','texto_prancha','prancha','status','motivo','cota_A_m','cota_A_parede','cota_B_m','cota_B_parede','embutido','memoria'],
    M.pontos.map(p=>{ const L=M.locacao[p.id]||{}; return [p.id,p.tipo,p.titulo,p.sistema,p.dn,p.x,p.y,p.z,p.h,p.pav,p.amb_nome,p.equipamento,p.texto,p.prancha,p.status,p.motivo,
      L.A?L.A.dist:null,L.A?L.A.parede:'',L.B?L.B.dist:null,L.B?L.B.parede:'',L.apoio?'sim':'não',p.memoria]; })),
  trechos: ()=>toCSV(['id','sistema','dn','no_inicio','no_fim','xa','ya','za','xb','yb','zb','comprimento_m','declividade_pct','enterrado_m','passagem','status','motivo','pontos'],
    M.trechos.map(t=>{ const A=nodes[t.a], Bn=nodes[t.b]; const ent=t.segs.filter(s=>s.enterrado).reduce((a,s)=>a+Math.hypot(s.b[0]-s.a[0],s.b[1]-s.a[1],s.b[2]-s.a[2]),0);
      return [t.id,t.sistema,t.dn,t.a,t.b,A.x,A.y,A.z,Bn.x,Bn.y,Bn.z,t.comprimento,t.declividade,Math.round(ent*1000)/1000,t.passagem,t.status,t.motivo,t.pontos.join(' ')]; })),
  divergencias: ()=>toCSV(['id','tipo','gravidade','disciplinas','descricao','pranchas','x','y','z','ids'],
    M.divergencias.map(d=>[d.id,d.tipo,d.gravidade,d.disciplinas.join(' '),d.descricao,d.pranchas.join(' | '),d.pos?d.pos[0]:null,d.pos?d.pos[1]:null,d.pos?d.pos[2]:null,d.ids.join(' ')])),
  dutos: ()=>toCSV(['id','sistema','rotulo','largura_m','altura_m','tipo','xa','ya','za','xb','yb','zb','comprimento_m','status','ventilador','passagem','nota','prancha'],
    M.dutos.map(d=>[d.id,d.sistema,d.rotulo,d.W,d.H,d.tipo,d.a[0],d.a[1],d.a[2],d.b[0],d.b[1],d.b[2],d.comprimento,d.status,d.exaustor,d.passagem,d.nota,d.prancha])),
  niveis: ()=>toCSV(['id','ambiente','tipo','PA','PO','z','x','y','status','fonte'], M.niveis.map(n=>[n.id,n.ambiente,n.tipo,n.pa,n.po,n.z==null?null:n.z,n.x,n.y,n.status,n.fonte])),
  cotas: ()=>toCSV(['id','inicio','fim','x1','y1','z1','x2','y2','z2','d3_m','horizontal_m','dx','dy','dz'],
    state.cotas.map(c=>[c.id,c.ini,c.fim,+c.p1.x.toFixed(3),+c.p1.y.toFixed(3),+c.p1.z.toFixed(3),+c.p2.x.toFixed(3),+c.p2.y.toFixed(3),+c.p2.z.toFixed(3),
      +c.d3.toFixed(3),+c.dh.toFixed(3),+c.dx.toFixed(3),+c.dy.toFixed(3),+c.dz.toFixed(3)])),
};
function download(name, text){
  if(window.__ARTIFACT__){ // no visualizador do claude.ai downloads são bloqueados: copia o CSV
    const done=()=>{ const b=document.activeElement; if(b&&b.tagName==='BUTTON'){ const o=b.textContent; b.textContent='CSV copiado'; setTimeout(()=>b.textContent=o,1600);} };
    (navigator.clipboard?navigator.clipboard.writeText(text.replace(/^\ufeff/,'')):Promise.reject()).then(done).catch(()=>{});
    return; } const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500); }

/* ---------- corte ---------- */
function cutUI(){ $('#cutVal').textContent = fmt(state.cutZ)+' (h '+fmt(state.cutZ-PA0)+' m)'; cutPlane.constant = state.cutZ;
  $('#cutHint').textContent = 'Piso −2,87 · coifas −0,87 · dutos até +1,20 · laje técnica +8,36 · cobertura +20,93'; }
$('#cut').addEventListener('input', e=>{ state.cutZ=parseFloat(e.target.value); if(!state.cut){ state.cut=true; $('#cutOn').checked=true; } cutUI(); applyVisibility(); });
$('#cutOn').addEventListener('change', e=>{ state.cut=e.target.checked; cutUI(); applyVisibility(); });

/* ---------- tema ---------- */
function curTheme(){ const t=document.documentElement.getAttribute('data-theme'); if(t) return t; return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
$('#theme').addEventListener('click', ()=>{ document.documentElement.setAttribute('data-theme', curTheme()==='dark'?'light':'dark'); themeColors(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(!document.documentElement.getAttribute('data-theme')) themeColors(); });

/* ---------- vistas e botões ---------- */
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.view)));
$('#fit').addEventListener('click', ()=>fit(RM?0:600));
$('#toggleLeft').addEventListener('click', e=>{ const o=!$('#left').classList.contains('open'); $('#left').classList.toggle('open', o); e.target.setAttribute('aria-pressed', o); viewOffset(); });

/* ---------- laço ---------- */
const tmp=new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  if(anim) anim(now);
  if(controls) controls.update();
  // anel pulsante voltado à câmera
  ptMeshes.forEach(m=>{ const r=m.userData.ring; if(!r) return; r.quaternion.copy(camera.quaternion); m.updateMatrixWorld();
    r.quaternion.premultiply(m.getWorldQuaternion(new THREE.Quaternion()).invert());
    const k = RM ? 1 : 1 + 0.25*Math.sin(now/280); r.scale.setScalar(k); r.visible = m.visible; });
  renderer.render(scene, camera);
  // rótulos
  const rc=canvas.getBoundingClientRect();
  labels.forEach(L=>{
    let vis = true;
    if(L.owner.kind==='room') vis = state.lay.nomes && state.lay.arq && state.view!=='under' && !(state.cut && L.pos.z>state.cutZ);
    if(L.owner.kind==='divlbl') vis = L.owner.m.visible;
    if(L.owner.kind==='meclbl') vis = L.owner.m.visible && !(state.cut && L.pos.z>state.cutZ+0.2);
    if(L.owner.kind==='dim' && L.owner.cota) vis = state.cotasVis;
    if(!vis){ L.el.style.display='none'; return; }
    tmp.copy(L.pos).project(camera);
    if(tmp.z>1||tmp.z<-1){ L.el.style.display='none'; return; }
    L.el.style.display=''; L.el.style.left=((tmp.x+1)/2*rc.width)+'px'; L.el.style.top=((1-tmp.y)/2*rc.height)+'px';
  });
}

/* ---------- início ---------- */
buildFilters(); legend(); cutUI();
setView('persp'); themeColors(); renderTab();
requestAnimationFrame(frame);
window.__app = {M, state, center:(x,y,z,d)=>center(new THREE.Vector3(x,y,z),d), gotoId, gotoDiv, setView, toggleMeasure, pickAt, toScreen, ptById, applyVisibility, buildFilters, setSel, snapAt, addCota, CSV, camera:()=>camera, labels};
})();
</script>
</body>
</html>
