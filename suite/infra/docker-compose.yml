# Serviços de apoio para desenvolvimento local.
# Uso (em suite/backend): docker compose -f ../infra/docker-compose.yml --env-file ../.env up -d banco s3 cria-balde
services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suite
      POSTGRES_PASSWORD: suite
      POSTGRES_DB: suite
    ports:
      - "5432:5432"
    volumes:
      - banco-dados:/var/lib/postgresql/data
      - ./banco-init.sql:/docker-entrypoint-initdb.d/banco-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suite -d suite"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /dados --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SUITE_S3_CHAVE}
      MINIO_ROOT_PASSWORD: ${SUITE_S3_SEGREDO}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-dados:/dados
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  cria-balde:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      s3:
        condition: service_healthy
    environment:
      SUITE_S3_CHAVE: ${SUITE_S3_CHAVE}
      SUITE_S3_SEGREDO: ${SUITE_S3_SEGREDO}
      SUITE_S3_BALDE: ${SUITE_S3_BALDE}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 $${SUITE_S3_CHAVE} $${SUITE_S3_SEGREDO} &&
      mc mb --ignore-existing local/$${SUITE_S3_BALDE}
      "

volumes:
  banco-dados:
  s3-dados:
